<title>Eye Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: one-screen study tool — depth rail | exam-view stage | structure panel. Textbook schematic, clinical neutrals biased toward ink blue. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#17202b; --ink-2:#2e3a47; --muted:#5d6977; --faint:#8a96a3;
  --line:#dce2e8; --line-2:#c8d0d8; --accent:#294d8c; --accent-ink:#ffffff; --accent-soft:#e2e9f5;
  --stage:#e7ebef; --field:#dde3e9; --field-ring:#c4ced7;
  --emergent:#c0352b; --urgent:#a86b12; --routine:#3a7653;
  --c-adnexa:#c4687a; --c-cornea:#2a92bd; --c-ac:#5672cc; --c-iris:#a26e2c; --c-lens:#b8921a; --c-vitreous:#8669c0; --c-retina:#d7552f; --c-choroid:#a12b47; --c-optic:#378868;
  --skin:#efd9cb; --skin-2:#e8cdbb; --skin-line:#c29a86; --brow:#8a6a58; --lash:#3a2b24;
  --sclera:#f8f7f3; --conj-v:#d3666b; --iris:#9b6a35; --iris-dark:#5c3a19; --iris-light:#cf9f62; --pupil:#141210; --ruff:#3b2614; --limbus:#7c5a3b; --beam:#ffffff;
  --lens-cortex:#efdf9f; --lens-hi:#fbf3cf; --lens-nucleus:#d6b053; --lens-capsule:#9e7c10;
  --fundus-1:#ee9063; --fundus-2:#c4452c; --macula:#8f2a1b; --fovea:#6a1c12; --disc:#f7d6aa; --cup:#fcefd4; --vein:#7a1913; --artery:#c3392b;
  --chor-bg:#6c1527; --chor-v1:#e46b4f; --chor-v2:#c95039; --rpe:#5b3b2c; --rpe-line:#9a6a4d; --rpe-curl:#80583f;
  --ppa:#f3bd94; --disc-zoom:#f4c89f; --lamina:#8c8070;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --row:54px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1116; --surface:#141a21; --surface-2:#19212a; --ink:#e3e8ee; --ink-2:#c3ccd6; --muted:#97a3b0; --faint:#6b7785;
  --line:#242e39; --line-2:#334050; --accent:#8db0ee; --accent-ink:#0d1116; --accent-soft:#1c2a40;
  --stage:#0a0e12; --field:#121920; --field-ring:#27323d;
  --emergent:#f06a5d; --urgent:#e3a54b; --routine:#6cc08d;
  --c-adnexa:#e48c9b; --c-cornea:#52b8e2; --c-ac:#8199f0; --c-iris:#d29b53; --c-lens:#e2c048; --c-vitreous:#aa92e6; --c-retina:#f27b56; --c-choroid:#dc5a77; --c-optic:#5db68f;
  --skin:#d6b9a6; --skin-2:#ccab96; --skin-line:#a17e6c; --sclera:#e6e5e0; --beam:#fffdf4;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1116; --surface:#141a21; --surface-2:#19212a; --ink:#e3e8ee; --ink-2:#c3ccd6; --muted:#97a3b0; --faint:#6b7785;
  --line:#242e39; --line-2:#334050; --accent:#8db0ee; --accent-ink:#0d1116; --accent-soft:#1c2a40;
  --stage:#0a0e12; --field:#121920; --field-ring:#27323d;
  --emergent:#f06a5d; --urgent:#e3a54b; --routine:#6cc08d;
  --c-adnexa:#e48c9b; --c-cornea:#52b8e2; --c-ac:#8199f0; --c-iris:#d29b53; --c-lens:#e2c048; --c-vitreous:#aa92e6; --c-retina:#f27b56; --c-choroid:#dc5a77; --c-optic:#5db68f;
  --skin:#d6b9a6; --skin-2:#ccab96; --skin-line:#a17e6c; --sclera:#e6e5e0; --beam:#fffdf4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* Header */
.top{display:flex;align-items:center;gap:20px;min-height:60px;flex:none;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.brand svg{flex:none}
.brand-name{font:600 21px/1 var(--display);letter-spacing:-.01em}
.brand-sub{font:500 10.5px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.search{position:relative;flex:1;max-width:480px;margin-inline:auto;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 38px 0 36px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--faint)}
.search .s-ico{position:absolute;left:11px;top:11px;color:var(--faint);pointer-events:none}
.search kbd{position:absolute;right:9px;top:9px}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--muted);background:var(--surface-2)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 36px rgba(10,20,30,.16);z-index:40;max-height:min(62vh,520px);overflow:auto;padding:6px;list-style:none;margin:0}
.results li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.results li.act{background:var(--accent-soft)}
.results .dot{width:9px;height:9px;border-radius:50%;grid-row:1/3}
.results .r-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .r-path{grid-column:2;font:400 11.5px var(--mono);color:var(--muted)}
.results .r-kind{grid-row:1/3;grid-column:3;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 7px}
.results .r-kind.em{color:var(--emergent);border-color:currentColor}
.results mark{background:color-mix(in srgb,var(--accent) 18%,transparent);color:inherit;border-radius:2px}
.results .none{display:block;padding:12px;color:var(--muted)}
.top-actions{display:flex;gap:10px;align-items:center;flex:none}
.btn-miss{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.btn-miss .pip{width:8px;height:8px;border-radius:50%;border:2px solid var(--emergent)}
.btn-miss[aria-pressed="true"]{background:var(--emergent);border-color:var(--emergent);color:#fff}
.btn-miss[aria-pressed="true"] .pip{background:#fff;border-color:#fff}
.proto{font:500 10.5px/1.25 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line-2);border-radius:6px;padding:5px 8px;max-width:190px}

/* Main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 470px}

/* Rail */
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px 14px 14px 0;gap:12px}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;padding-left:2px}
.rail-head b{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.rail-head span{font:400 10.5px var(--mono);color:var(--faint)}
.rail-body{position:relative;flex:none}
.stops{list-style:none;margin:0;padding:0 0 0 30px}
.stop{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;height:var(--row);width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:0 8px;cursor:pointer;color:var(--ink-2)}
.stop:hover{background:var(--surface-2)}
.stop.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.stop-n{font:500 11px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.stop.on .stop-n{color:var(--ink)}
.stop-text{display:flex;flex-direction:column;min-width:0;gap:2px}
.stop-name{font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-meta{display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.bar{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--c-cornea);border-radius:2px}
.stop-alert{font:600 10.5px/1 var(--mono);color:var(--emergent);border:1px solid currentColor;border-radius:999px;padding:3px 6px}
.track{position:absolute;left:4px;top:calc(var(--row) / 2);height:calc(var(--row) * 8);width:20px;cursor:grab;touch-action:none;border-radius:10px}
.track:active{cursor:grabbing}
.track-line{position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line-2);border-radius:2px}
.track-fill{position:absolute;left:9px;top:0;width:2px;background:var(--accent);border-radius:2px}
.tick{position:absolute;left:5px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--tc)}
.thumb{position:absolute;left:0;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 2px 6px rgba(0,0,0,.2);pointer-events:none}
.inset{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 8px 4px;margin-left:12px;flex:none}
.inset-cap{display:flex;justify-content:space-between;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 2px}
.inset-cap b{color:var(--ink-2);font-weight:500}
#sag{display:block;width:100%;height:auto}
.sg{opacity:.32;transition:opacity .25s;cursor:pointer}
.sg.on{opacity:1}
.sg-fill{fill:var(--sc);fill-opacity:.35;stroke:var(--sc);stroke-width:1.2}
.sg-line{fill:none;stroke:var(--sc);stroke-width:2.4;stroke-linecap:round}
.sg.on .sg-line{stroke-width:3.4}
.sg-glob{fill:none;stroke:var(--faint);stroke-width:2.2}
.sghit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
.plane{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3}
.plane-dot{fill:var(--accent)}
.sag-txt{font:500 8.5px var(--mono);fill:var(--faint);letter-spacing:.06em}
.rail-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--muted);padding-left:12px}
.rail-foot span{display:inline-flex;align-items:center;gap:4px}

/* Stage */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--stage);overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px 0;flex:none}
.eyebrow{font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stage-head h1{font:600 26px/1.15 var(--display);margin:3px 0 0;letter-spacing:-.01em;text-wrap:balance}
.stage-hint{font:400 11.5px/1.4 var(--mono);color:var(--muted);text-align:right;max-width:240px}
.eye-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px 14px}
#eye{width:100%;height:100%;max-width:100%;display:block;user-select:none;-webkit-user-select:none}
.layer{transition:none}
.hit{fill:transparent;stroke:transparent;cursor:pointer;transition:fill .15s,stroke .15s}
.hit:hover,.hit.hl{fill:color-mix(in srgb,var(--hc) 22%,transparent);stroke:var(--hc);stroke-width:2}
.hit.hs{fill:none;stroke-width:16;stroke-linecap:round}
.hit.hs:hover,.hit.hs.hl{fill:none;stroke:color-mix(in srgb,var(--hc) 45%,transparent);stroke-width:16}
.hit.alert{stroke:var(--emergent);stroke-width:2.4;stroke-dasharray:7 6;animation:march 1.2s linear infinite}
.hit.hs.alert{stroke:color-mix(in srgb,var(--emergent) 45%,transparent);stroke-width:16;stroke-dasharray:none;animation:none}
@keyframes march{to{stroke-dashoffset:-26}}
.lbl{pointer-events:none}
.lbl text{font:500 12.5px var(--body);fill:var(--ink-2)}
.lbl path{stroke:var(--muted);stroke-width:1;fill:none}
.lbl circle{fill:var(--ink-2)}
.lbl.lt text{fill:#fff}
.lbl.lt path{stroke:rgba(255,255,255,.75)}
.lbl.lt circle{fill:#fff}
.ui-txt{font:600 13px var(--mono);fill:var(--ink-2);letter-spacing:.08em}
#eye .patho{pointer-events:none;animation:pin .35s ease-out}
@keyframes pin{from{opacity:0}to{opacity:1}}
#eye .patho.off{opacity:0;transition:opacity .2s}
#eye.figon .lbl{opacity:.1;transition:opacity .2s}
.figbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:max-content;max-width:min(94%,600px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:9px 10px 9px 14px;box-shadow:0 10px 30px rgba(10,20,30,.16);z-index:15}
.fig-ico{flex:none;color:var(--accent)}
.fig-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.fig-txt b{font-size:13px;font-weight:600;color:var(--ink)}
.fig-txt span{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.fig-txt small{font:400 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.figbtn{flex:none;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);padding:0 10px;font:500 12px var(--body);cursor:pointer;color:var(--ink-2);white-space:nowrap}
.figbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.figbtn.x{width:30px;padding:0;font-size:16px;line-height:1}
.stubbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.stubbtn:hover{text-decoration:underline}
.stubbtn svg{display:inline-block;vertical-align:-2px;margin-left:5px}
.stubbtn.on{font-weight:600;color:var(--ink)}
.card.figon{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.linkbtn.on{font-weight:700}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font:500 12px/1.3 var(--body);padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(12px,12px)}
.tip small{display:block;font:400 10.5px var(--mono);opacity:.75;margin-top:2px}

/* Panel */
.panel{border-left:1px solid var(--line);overflow:auto;min-height:0;background:var(--surface);scroll-behavior:smooth}
.p-head{padding:18px 22px 14px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font:400 11.5px var(--mono);color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;font:inherit}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--ink-2)}
.p-title{display:flex;align-items:center;gap:10px;margin-top:10px}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.p-title h2{font:600 28px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.p-view{font:400 11px var(--mono);color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.p-sum{color:var(--ink-2);margin:12px 0 0;max-width:62ch;font-size:14px;line-height:1.55}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fact{font:500 11.5px/1.3 var(--mono);padding:5px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mini{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;background:var(--surface-2)}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.mini svg{display:block;width:100%;height:auto}
.mini .band{cursor:pointer}
.mini .band:hover .bhit{fill:color-mix(in srgb,var(--c-cornea) 14%,transparent)}
.mini .bhit{fill:transparent}
.mini .band.sel .bhit{fill:color-mix(in srgb,var(--c-cornea) 18%,transparent)}
.mini text{font:500 11px var(--body);fill:var(--ink-2)}
.mini text.sm{font:400 10px var(--mono);fill:var(--muted)}
.octcap{font-size:12.5px;color:var(--ink-2);min-height:3em;margin:6px 0 2px}
.octcap b{font-weight:600}
.p-ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 22px}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subchip{height:30px;padding:0 11px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.subchip span{font:400 10.5px var(--mono);color:var(--muted)}
.subchip[aria-pressed="true"]{background:color-mix(in srgb,var(--sc) 14%,var(--surface));border-color:var(--sc);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.flabel{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-right:2px}
.fchip{height:26px;padding:0 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);cursor:pointer;font:500 11.5px var(--body);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.fchip .k{width:7px;height:7px;border-radius:50%;background:var(--kc)}
.fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2);background:var(--surface-2)}
.fchip[aria-pressed="false"].u{opacity:.55;text-decoration:line-through}
.fsel{height:26px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink-2);font:500 11.5px var(--body);padding:0 6px}
.fsp{flex:1}
.linkbtn{border:0;background:none;color:var(--accent);font:500 12px var(--body);cursor:pointer;padding:2px 2px}
.linkbtn:hover{text-decoration:underline}
.p-body{padding:4px 22px 48px}
.note{margin-top:16px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2);max-width:62ch}
.note b{font-weight:600}
.grp{margin-top:22px;scroll-margin-top:110px}
.grp-h{display:flex;align-items:baseline;gap:10px}
.grp-h h3{font:600 19px/1.2 var(--display);margin:0}
.grp-n{font:400 11px var(--mono);color:var(--muted)}
.grp-desc{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:62ch}
.grp-cards{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:120px;transition:border-color .2s,box-shadow .2s}
.card.open{border-color:var(--line-2);box-shadow:0 4px 18px rgba(15,25,40,.07)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 3px transparent}}
.card-head{display:grid;gap:5px;width:100%;text-align:left;border:0;background:none;padding:12px 40px 12px 14px;cursor:pointer;position:relative;border-radius:10px}
.card-head:hover{background:var(--surface-2)}
.card.open .card-head{border-radius:10px 10px 0 0}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.names{min-width:0}
.card-name{font-weight:600;font-size:15px;line-height:1.3;color:var(--ink)}
.card-aka{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:52%}
.urg{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.urg-E{color:var(--emergent);background:color-mix(in srgb,var(--emergent) 9%,transparent)}
.urg-U{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 9%,transparent)}
.urg-R{color:var(--routine);background:color-mix(in srgb,var(--routine) 9%,transparent)}
.tag{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.hy{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.tag.mst{color:var(--routine);border-color:color-mix(in srgb,var(--routine) 40%,transparent)}
.card-hook{color:var(--ink-2);font-size:13px;line-height:1.45;max-width:62ch}
.chev{position:absolute;right:14px;top:15px;color:var(--faint);transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.card.open .card-body{animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fields{display:grid;grid-template-columns:112px minmax(0,1fr);gap:11px 14px;margin:13px 0 0}
.fields dt{font:500 10px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:3px}
.fields dd{margin:0;min-width:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.fields ul{margin:0;padding-left:15px}
.fields li{margin:2px 0}
.fields li::marker{color:var(--faint)}
.fields dd.pearls{background:color-mix(in srgb,var(--c-cornea) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c-cornea) 22%,transparent);border-radius:8px;padding:8px 10px 8px 8px}
.fields dd.trials li{font-size:13px}
.trial-name{font:600 11px var(--mono);letter-spacing:.02em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 12px var(--body);padding:3px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
button.chip{cursor:pointer;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
button.chip:hover{background:var(--accent-soft)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.mcheck{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.mcheck input{width:16px;height:16px;accent-color:var(--routine)}
.anchor{font:400 11px var(--mono);color:var(--faint)}
.stubs{margin-top:12px;border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px 12px}
.stubs-h{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.stubs ul{list-style:none;margin:0;padding:0;columns:2;column-gap:18px}
.stubs li{break-inside:avoid;font-size:13px;color:var(--ink-2);padding:3px 0 3px 13px;position:relative;line-height:1.35;border-radius:4px}
.stubs li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.stubs li.em::before{background:var(--emergent);width:7px;height:7px;top:8px;left:-1px}
.stubs li.flash{animation:flashbg 1.8s ease-out}
@keyframes flashbg{0%,35%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.empty{margin-top:28px;text-align:center;color:var(--muted);font-size:13.5px}
.legend{display:flex;gap:12px;align-items:center;margin-top:8px;font:400 11px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emergent);margin-right:5px}

/* Responsive */
@media (max-width:1320px){.main{grid-template-columns:220px minmax(0,1fr) 430px}}
@media (max-width:1180px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:220px minmax(0,1fr)}
  .stage{height:min(78vh,640px)}
  .panel{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .rail{padding-bottom:16px}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;padding-block:10px;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .proto{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;padding:10px 0 8px;gap:8px}
  .rail-head,.rail-foot,.inset,.track{display:none}
  .stops{display:flex;overflow-x:auto;padding:0 0 4px;gap:6px;scrollbar-width:thin}
  .stop{height:auto;padding:8px 11px;grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .stop-meta{display:none}
  .stage{height:min(108vw,560px)}
  .stage-head{padding:12px 12px 0}
  .stage-hint{display:none}
  .p-head,.p-ctrl,.p-body{padding-left:0;padding-right:0}
  .fields{grid-template-columns:minmax(0,1fr);gap:4px 0}
  .fields dt{padding-top:8px}
  .stubs ul{columns:1}
  .tags{max-width:none}
  .row1{flex-direction:column}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<div class="app">
  <header class="top">

  </header>

  <main class="main">

        <div class="track" id="track" role="slider" tabindex="0" aria-label="Depth into the eye" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="9" aria-valuenow="2">

      </div>
      <div class="rail-foot"><span><kbd>←</kbd><kbd>→</kbd> depth</span><span><kbd>/</kbd> search</span><span><kbd>Esc</kbd> back</span></div>
    </nav>

    <section class="stage" id="stage" aria-label="Eye diagram">
      <div class="stage-head">
        <div><div class="eyebrow" id="stEyebrow"></div><h1 id="stName"></h1></div>
        <div class="stage-hint">Click a structure to open it. Scroll or drag the depth rail to go deeper.</div>
      </div>
      <div class="eye-wrap"><svg id="eye" viewBox="0 0 640 640" role="img" aria-label="Schematic eye at the current depth"></svg></div>
      <div class="tip" id="tip" hidden></div>
      <div class="figbar" id="figbar" hidden role="status">
        <svg class="fig-ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M1.5 9S4.5 3.5 9 3.5 16.5 9 16.5 9 13.5 14.5 9 14.5 1.5 9 1.5 9Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2.6" fill="currentColor"/></svg>
        <div class="fig-txt"><b id="figN"></b><span id="figT"></span><small id="figV"></small></div>
        <button class="figbtn" id="figCmp" aria-pressed="false" title="Hide the drawing to compare with normal">Compare normal</button>
        <button class="figbtn x" id="figX" aria-label="Hide drawing">×</button>
      </div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

/* --- Drawing state --- */
const figbar = $('#figbar');
const figName = k => CARD[k] ? CARD[k].name : k.slice(2);
function syncFigMarks(){
  $$('#panel [data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === state.fig));
  $$('#panel .card').forEach(c => c.classList.toggle('figon', c.dataset.id === state.fig));
}
function renderFig(){
  $$('#eye .patho').forEach(g => g.remove());
  const f = state.fig && FIG[state.fig];
  if (!f || f.stop !== state.stop){ figbar.hidden = true; eye.classList.remove('figon'); syncFigMarks(); return; }
  let html = '';
  try { html = f.d(); } catch(e){ console.error(e); }
  layers()[f.stop].insertAdjacentHTML('beforeend', `<g class="patho${state.figCmp ? ' off' : ''}">${html}</g>`);
  eye.classList.toggle('figon', !state.figCmp);
  $('#figN').textContent = figName(state.fig); $('#figT').textContent = f.t; $('#figV').textContent = f.v;
  $('#figCmp').setAttribute('aria-pressed', !!state.figCmp);
  figbar.hidden = false; syncFigMarks();
}
function hideFig(){ state.fig = null; state.figCmp = false; renderFig(); }
$('#figX').addEventListener('click', hideFig);
$('#figCmp').addEventListener('click', () => {
  state.figCmp = !state.figCmp;
  const g = $('#eye .patho'); if (g) g.classList.toggle('off', state.figCmp);
  eye.classList.toggle('figon', !state.figCmp);
  $('#figCmp').setAttribute('aria-pressed', state.figCmp);
});

function miniCornea(){
  const bands = [
    {y:8, h:5, name:'Tear film', note:'~3 µm'},
    {y:13, h:32, name:'Epithelium', note:'~50 µm', sub:'epi'},
    {y:45, h:7, name:'Bowman layer', note:'8–12 µm', sub:'bow'},
    {y:52, h:78, name:'Stroma', note:'~500 µm', sub:'str'},
    {y:130, h:7, name:'Descemet', note:'3–15 µm', sub:'desc'},
    {y:137, h:15, name:'Endothelium', note:'monolayer', sub:'endo'}];
  const W = 270, R = rng(3); let art = '';
  art += `<rect x="10" y="8" width="${W}" height="5" style="fill:var(--c-cornea)" opacity=".18"/>`;
  for (let x = 14; x < W; x += 16) art += `<ellipse cx="${x + 4}" cy="17" rx="8" ry="2.4" style="fill:var(--c-cornea);stroke:var(--c-cornea)" fill-opacity=".18" stroke-opacity=".6" stroke-width=".7"/>`;
  for (let x = 12; x < W; x += 13) art += `<ellipse cx="${x + 6}" cy="27" rx="6.5" ry="4.2" style="fill:var(--c-cornea);stroke:var(--c-cornea)" fill-opacity=".14" stroke-opacity=".55" stroke-width=".7"/>`;
  for (let x = 11; x < W + 2; x += 8) art += `<rect x="${x}" y="33" width="7" height="11" rx="2.5" style="fill:var(--c-cornea);stroke:var(--c-cornea)" fill-opacity=".22" stroke-opacity=".6" stroke-width=".7"/>`;
  art += `<rect x="10" y="45" width="${W}" height="7" style="fill:var(--c-cornea)" opacity=".55"/>`;
  art += `<rect x="10" y="52" width="${W}" height="78" style="fill:var(--c-cornea)" opacity=".08"/>`;
  for (let y = 56, i = 0; y < 128; y += 6, i++) art += `<line x1="10" x2="${10 + W}" y1="${y}" y2="${y}" style="stroke:var(--c-cornea)" stroke-width=".8" opacity=".35"${i % 2 ? ' stroke-dasharray="1.5 2.5"' : ''}/>`;
  for (let k = 0; k < 18; k++) art += `<ellipse cx="${r1(18 + R() * (W - 18))}" cy="${r1(58 + R() * 68)}" rx="7" ry="1.4" style="fill:var(--c-cornea)" opacity=".75"/>`;
  art += `<rect x="10" y="130" width="${W}" height="7" style="fill:var(--c-cornea)" opacity=".42"/>`;
  for (let x = 10; x < W + 6; x += 18) art += `<rect x="${x}" y="138" width="17" height="12" rx="2" style="fill:var(--c-cornea);stroke:var(--c-cornea)" fill-opacity=".25" stroke-opacity=".7" stroke-width=".7"/><circle cx="${x + 8.5}" cy="144" r="2" style="fill:var(--c-cornea)" opacity=".8"/>`;
  const rows = bands.map(b => {
    const ly = b.y + b.h / 2 + 4;
    const label = `<line x1="${10 + W}" x2="${W + 22}" y1="${b.y + b.h / 2}" y2="${b.y + b.h / 2}" style="stroke:var(--line-2)"/><text x="${W + 26}" y="${ly - 1}">${b.name}</text><text class="sm" x="${W + 26}" y="${ly + 11}">${b.note}</text>`;
    if (!b.sub) return `<g>${label}</g>`;
    return `<g class="band${state.sub === b.sub ? ' sel' : ''}" data-act="layer" data-sub="${b.sub}" role="button" tabindex="0" aria-label="Filter to ${b.name}"><rect class="bhit" x="4" y="${b.y}" width="412" height="${b.h}" rx="3"/>${label}</g>`;
  }).join('');
  return `<div class="mini"><div class="mini-h"><span>Corneal layers</span><span>not to scale · click a layer</span></div>
    <svg viewBox="0 0 420 172">${art}${rows}</svg></div>`;
}

    {h:16, fill:'#6e4b33', op:.85, name:'Pigmented TM'},

const OCT = [
  {n:'Vitreous', h:14, c:'#0b0b0b', t:'Posterior hyaloid: VMT and VMA are judged here.'},
  {n:'ILM', h:2, c:'#d9d9d9', t:'ILM: ERM sits on it; it is peeled for macular holes.'},
  {n:'NFL', h:12, c:'#c9c9c9', t:'Nerve fiber layer: thins in glaucoma; cotton-wool spots are axoplasmic stasis here.'},
  {n:'GCL', h:12, c:'#5e5e5e', t:'Ganglion cell layer: thins in glaucoma and optic neuropathy; cherry-red spot when it is opacified around the fovea.'},
  {n:'IPL', h:10, c:'#b0b0b0', t:'Inner plexiform layer: often analyzed together with GCL (GCIPL).'},
  {n:'INL', h:12, c:'#444', t:'Inner nuclear layer: cystoid spaces in DME and CME; hyperreflective band in PAMM.'},
  {n:'OPL', h:7, c:'#a4a4a4', t:'Outer plexiform layer (Henle fibers): hard exudates and flame/dot hemorrhage planes.'},
  {n:'ONL', h:22, c:'#353535', t:'Outer nuclear layer: photoreceptor nuclei; thins in RP and outer retinal atrophy.'},
  {n:'ELM', h:2, c:'#9c9c9c', t:'External limiting membrane: an intact ELM predicts better recovery after macular hole or RD repair.'},
  {n:'EZ', h:5, c:'#e2e2e2', t:'Ellipsoid zone: disrupted in macular hole, RP and hydroxychloroquine toxicity ("flying saucer").'},
  {n:'RPE / Bruch', h:9, c:'#f3f3f3', t:'RPE–Bruch complex: drusen and PEDs lift it; type 1 CNV grows beneath it.'},
  {n:'Choroid', h:30, c:'#6d6d6d', t:'Choroid: thick in CSC and pachychoroid disease; thin in high myopia.'}];
function miniOct(){
  let y = 6, art = '', labels = '', ly = -99;
  OCT.forEach((b, i) => {
    art += `<g data-oct="${i}" style="cursor:pointer"><rect x="10" y="${y}" width="250" height="${b.h}" fill="${b.c}"/>`;
    if (b.n === 'Choroid') for (let x = 16; x < 255; x += 22) art += `<ellipse cx="${x}" cy="${y + b.h / 2}" rx="8" ry="${b.h / 3}" fill="#2a2a2a"/>`;
    art += `</g>`;
    const c = y + b.h / 2; ly = Math.max(c, ly + 12.5);
    labels += `<path d="M260 ${c}L270 ${c}L282 ${ly}L288 ${ly}" fill="none" style="stroke:var(--line-2)"/><text x="292" y="${ly + 4}" data-oct="${i}" style="cursor:pointer">${b.n}</text>`;
    y += b.h;
  });
  y = Math.max(y, ly + 8);
  return `<div class="mini"><div class="mini-h"><span>Macular OCT layers</span><span>hover a layer</span></div>
    <svg viewBox="0 0 420 ${y + 8}">${art}${labels}</svg>
    <div class="octcap" id="octcap">Hover a layer to see which diseases live in it.</div></div>`;
}

const panel = $('#panel');
const isDefaultFilt = () => state.filt.urg.size === 3 && state.filt.cat === 'all' && !state.filt.hy && !state.filt.hideM;
const emergentOnly = () => state.filt.urg.size === 1 && state.filt.urg.has('E') && state.filt.cat === 'all' && !state.filt.hy;
const passes = c => state.filt.urg.has(c.urg) && (state.filt.cat === 'all' || c.cat === state.filt.cat) && (!state.filt.hy || c.hy) && (!state.filt.hideM || !state.mastered.has(c.id));
const stubPasses = x => isDefaultFilt() || (emergentOnly() && !state.filt.hideM ? x.em : (emergentOnly() ? x.em : false));
const LABELS = {risk:'Risk factors', pres:'Presentation', find:'Exam findings', work:'Workup', ddx:'Differential', mgmt:'Management', comp:'Complications', trials:'Landmark trials', pearls:'Pearls & buzzwords'};
const EYE_ICO = `<svg width="13" height="13" viewBox="0 0 18 18" aria-hidden="true"><path d="M1.5 9S4.5 3.5 9 3.5 16.5 9 16.5 9 13.5 14.5 9 14.5 1.5 9 1.5 9Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="2.6" fill="currentColor"/></svg>`;
const CHEV = `<svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function fieldHTML(key, v){
  if (!v || (Array.isArray(v) && !v.length)) return '';
  let dd;
  if (key === 'ddx'){
    dd = `<div class="chips">${v.map(x => CARD[x] ? `<button class="chip" data-act="goto" data-id="${x}">${esc(CARD[x].name)}</button>` : `<span class="chip">${esc(x)}</span>`).join('')}</div>`;
  } else if (key === 'trials'){
    dd = `<ul>${v.map(([n, t]) => `<li><span class="trial-name">${esc(n)}</span> · ${esc(t)}</li>`).join('')}</ul>`;
  } else if (key === 'comp'){
    dd = `<ul>${v.map(x => CARD[x] ? `<li><button class="chip" data-act="goto" data-id="${x}">${esc(CARD[x].name)}</button></li>` : `<li>${esc(x)}</li>`).join('')}</ul>`;
  } else dd = Array.isArray(v) ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${esc(v)}</p>`;
  return `<dt>${LABELS[key]}</dt><dd class="${key}">${dd}</dd>`;
}
function cardHTML(c){
  const open = state.open.has(c.id), m = state.mastered.has(c.id);
  return `<article class="card${open ? ' open' : ''}" id="card-${c.id}" data-id="${c.id}">
    <button class="card-head" data-act="toggle" data-id="${c.id}" aria-expanded="${open}" aria-controls="body-${c.id}">
      <span class="row1"><span class="names"><span class="card-name">${esc(c.name)}</span>${c.aka ? `<span class="card-aka">${esc(c.aka)}</span>` : ''}</span>
      <span class="tags"><span class="urg urg-${c.urg}">${URG[c.urg]}</span><span class="tag">${esc(c.cat)}</span>${c.hy ? '<span class="tag hy" title="High-yield">HY</span>' : ''}${m ? '<span class="tag mst" title="Mastered">✓</span>' : ''}</span></span>
      <span class="card-hook">${esc(c.hook)}</span>${CHEV}
    </button>

const track = $('#track'), thumb = $('#thumb'), tfill = $('#tfill');

function renderRail(){

function emergentCount(s){ return s.cards.filter(c => c.urg === 'E').length + s.stubList.filter(x => x.em).length; }
function updateRail(){
  STRUCTS.forEach((s, i) => {
    const m = $('#meta-' + i), a = $('#alert-' + i); if (!m) return;

      const n = s.cards.filter(c => state.mastered.has(c.id)).length;

}
function measureRow(){ const b = $('.stop'); if (b && b.offsetHeight) ROW = b.offsetHeight; $$('.tick').forEach(t => t.style.top = (+t.dataset.i * ROW) + 'px'); }

const layers = () => $$('#eye .layer');
const smooth = x => x * x * (3 - 2 * x);

    const t = d - i, a = Math.abs(t);

    g.style.opacity = op;
    g.style.visibility = op < .01 ? 'hidden' : 'visible';
    g.style.pointerEvents = a < .5 ? 'auto' : 'none';
    g.setAttribute('transform', `translate(${CX} ${CY}) scale(${r1(sc * 1000) / 1000}) translate(${-CX} ${-CY})`);
  });
  thumb.style.top = (d * ROW) + 'px'; tfill.style.height = (d * ROW) + 'px';
  const i0 = Math.floor(d), i1 = Math.min(8, i0 + 1), fr = d - i0, x = PLANE_X[i0] + (PLANE_X[i1] - PLANE_X[i0]) * fr;
  const pl = $('#plane'), pd = $('#planeDot'); if (pl){ pl.setAttribute('x1', x); pl.setAttribute('x2', x); pd.setAttribute('cx', x); }
  const stop = Math.round(d);

}
function onStop(i){

  const p = pending && pending.target === i ? pending : null;
  if (p) pending = null;
  state.sub = (p && p.sub) || 'all';
  if (state.fig && FIG[state.fig] && FIG[state.fig].stop !== i) { state.fig = null; state.figCmp = false; }
  $('#stEyebrow').textContent = `Stop ${i + 1} of 9 · ${s.view}`;

  renderFig();

function navTo(i, p = {}){ pending = {target:i, ...p}; animateTo(i); }
let anim = 0;
function animateTo(target, done){

/* Track drag */
let dragging = false;
const fromY = y => { const r = track.getBoundingClientRect(); applyDepth((y - r.top) / ROW); };
track.addEventListener('pointerdown', e => { dragging = true; pending = null; cancelAnimationFrame(anim); track.setPointerCapture(e.pointerId); fromY(e.clientY); });
track.addEventListener('pointermove', e => { if (dragging) fromY(e.clientY); });

track.addEventListener('pointerup', endDrag); track.addEventListener('pointercancel', endDrag);
track.addEventListener('keydown', e => {
  const k = e.key;

  else if (k === 'ArrowUp' || k === 'ArrowLeft'){ e.preventDefault(); step(-1); }

$('#stops').addEventListener('click', e => { const b = e.target.closest('.stop'); if (b) animateTo(+b.dataset.i); });

}, {passive:false});

const INDEX = [];

  s.subs.forEach(sub => INDEX.push({k:'sub', name:sub.name, s:s.id, sub:sub.id, path:s.short, blob:(sub.name + ' ' + s.short).toLowerCase()}));
  s.stubList.forEach(x => INDEX.push({k:'stub', name:x.name, s:s.id, sub:x.sub, em:x.em, path:s.short + ' › ' + s.subs.find(u => u.id === x.sub).name, blob:(x.name + ' ' + s.short).toLowerCase()}));
});
CARDS.forEach(c => INDEX.push({k:'card', name:c.name, aka:c.aka || '', id:c.id, s:c.s, sub:c.sub, em:c.urg === 'E',
  path:STRUCTS[SIDX[c.s]].short + ' › ' + STRUCTS[SIDX[c.s]].subs.find(u => u.id === c.sub).name,
  blob:[c.name, c.aka, c.hook, c.cat, ...(c.find || []), ...(c.pearls || []), ...(c.work || []), ...(c.trials || []).flat(), ...(c.risk || [])].join(' ').toLowerCase()}));

function search(str){

    const n = e.name.toLowerCase(), a = (e.aka || '').toLowerCase();
    let sc = n.startsWith(s) ? 100 : n.includes(s) ? 70 : a.includes(s) ? 60 : 20;
    sc += e.k === 'card' ? 12 : e.k === 'struct' ? 8 : e.k === 'sub' ? 4 : 0;
    return {e, sc};
  }).sort((x, y) => y.sc - x.sc || x.e.name.localeCompare(y.e.name)).slice(0, 12).map(x => x.e);
}
function hl(name, str){

  qres.hidden = false; q.setAttribute('aria-expanded', 'true');
}
function setAct(i){ if (!results.length) return; act = (i + results.length) % results.length; $$('#qres li').forEach((li, k) => { li.classList.toggle('act', k === act); li.setAttribute('aria-selected', k === act); }); const li = $('#opt-' + act); li && li.scrollIntoView({block:'nearest'}); q.setAttribute('aria-activedescendant', 'opt-' + act); }
function choose(e){
  if (!e) return;
  qres.hidden = true; q.setAttribute('aria-expanded', 'false'); q.blur();
  if (e.k === 'card') goCard(e.id);
  else if (e.k === 'stub') goStub(e.s, e.sub, e.name, FIG['s:' + e.name] ? 's:' + e.name : null);
  else if (e.k === 'sub') selectRegion(e.s, e.sub);
  else selectRegion(e.s, null);
}
q.addEventListener('input', renderResults);
q.addEventListener('focus', () => { if (q.value.trim()) renderResults(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); setAct(act + 1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); setAct(act - 1); }
  else if (e.key === 'Enter'){ e.preventDefault(); choose(results[act]); }
  else if (e.key === 'Escape'){ e.preventDefault(); if (q.value) { q.value = ''; renderResults(); } else q.blur(); }
});
qres.addEventListener('pointerdown', e => { const li = e.target.closest('li[data-i]'); if (li){ e.preventDefault(); choose(results[+li.dataset.i]); } });
q.addEventListener('blur', () => setTimeout(() => { qres.hidden = true; q.setAttribute('aria-expanded', 'false'); }, 120));

/* Global keys */
document.addEventListener('keydown', e => {
  const el = document.activeElement, typing = el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox';
  if (e.key === '/' && !typing){ e.preventDefault(); q.focus(); q.select(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape'){
    if (state.fig){ hideFig(); }
    else if (state.open.size){ $$('#panel .card.open').forEach(c => setCardOpen(c.dataset.id, false)); state.open.clear(); setHash(STRUCTS[state.stop].id); }
    else if (state.sub !== 'all'){ state.sub = 'all'; renderPanel(true); updateHits(); }
    return;
  }
  if (el === track) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
});

/* =========================================================
   INIT
   ========================================================= */
buildEye(); buildSag(); renderRail(); measureRow(); layoutLabels();
applyDepth(1);
if (!route(location.hash.slice(1))){ /* default: cornea */ }
addEventListener('resize', () => { const d = state.depth; measureRow(); applyDepth(d); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutLabels(); measureRow(); applyDepth(state.depth); });
})();
